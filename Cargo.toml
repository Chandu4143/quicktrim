[package]
name = "quicktrim"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "A minimal desktop video trimmer: open a clip, set IN and OUT, save a copy"
repository = "https://github.com/quicktrim/quicktrim"
readme = "README.md"
default-run = "quicktrim"

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "backend-winit",
    "renderer-software",
    "compat-1-2",
    "accessibility",
    "std",
] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Keep build artifacts small: QuickTrim is a small utility, not a library.
[profile.dev]
debug = 0

[[bin]]
name = "quicktrim"
path = "src/main.rs"
